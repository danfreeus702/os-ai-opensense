# OPNsense AI plugin configd actions (OPNsense 26.7 colon syntax)

[aiopensense]
    command:/usr/local/opnsense/scripts/aiopensense/aiopensense.php
    type:script
    message:OPNsense AI assistant
    description:OPNsense AI assistant

[enable]
    command:/usr/local/opnsense/scripts/aiopensense/enable.php
    type:script
    message:Enable OPNsense AI
    description:Enable OPNsense AI

[disable]
    command:/usr/local/opnsense/scripts/aiopensense/disable.php
    type:script
    message:Disable OPNsense AI
    description:Disable OPNsense AI

# Rollback support
[snapshot]
    command:/usr/local/opnsense/scripts/aiopensense/security.py snapshot
    type:script
    message:Save a config snapshot before applying changes
    description:Save a config snapshot before applying changes

[undo]
    command:/usr/local/opnsense/scripts/aiopensense/security.py undo
    type:script
    message:Restore the last config snapshot
    description:Restore the last config snapshot

# Security Wizard actions — call security.py with the action name
[unbound-enable]
    command:/usr/local/opnsense/scripts/aiopensense/security.py enable_unbound
    type:script
    message:Enable Unbound DNS with local cache
    description:Enable Unbound DNS with local cache

[blocklist]
    command:/usr/local/opnsense/scripts/aiopensense/security.py blocklist
    type:script
    message:Install ad/tracker DNS blocklists
    description:Install ad/tracker DNS blocklists

[doh]
    command:/usr/local/opnsense/scripts/aiopensense/security.py doh
    type:script
    message:Configure encrypted DNS upstream
    description:Configure encrypted DNS upstream

[dnssec]
    command:/usr/local/opnsense/scripts/aiopensense/security.py dnssec
    type:script
    message:Enable DNSSEC validation
    description:Enable DNSSEC validation

[dot]
    command:/usr/local/opnsense/scripts/aiopensense/security.py dot
    type:script
    message:Configure DNS-over-TLS upstreams
    description:Configure DNS-over-TLS upstreams

[firewall]
    command:/usr/local/opnsense/scripts/aiopensense/security.py firewall
    type:script
    message:Add required firewall rules
    description:Add required firewall rules

[tailscale]
    command:/usr/local/opnsense/scripts/aiopensense/security.py tailscale
    type:script
    message:Enable Tailscale exit node
    description:Enable Tailscale exit node

[record_level]
    command:/usr/local/opnsense/scripts/aiopensense/security.py record_level
    type:script
    message:Record applied security level
    description:Record applied security level

[clamav]
    command:/usr/local/opnsense/scripts/aiopensense/security.py clamav
    type:script
    message:Enable ClamAV antivirus
    description:Enable ClamAV antivirus

[crowdsec]
    command:/usr/local/opnsense/scripts/aiopensense/security.py crowdsec
    type:script
    message:Enable CrowdSec intrusion prevention
    description:Enable CrowdSec intrusion prevention

[firewall-dns]
    command:/usr/local/opnsense/scripts/aiopensense/security.py firewall_dns
    type:script
    message:Allow LAN DNS (TCP/UDP 53)
    description:Allow LAN DNS (TCP/UDP 53)

[firewall-doh]
    command:/usr/local/opnsense/scripts/aiopensense/security.py firewall_doh
    type:script
    message:Allow LAN DoH (TCP 443)
    description:Allow LAN DoH (TCP 443)

[firewall-dot]
    command:/usr/local/opnsense/scripts/aiopensense/security.py firewall_dot
    type:script
    message:Allow LAN DoT (TCP 853)
    description:Allow LAN DoT (TCP 853)
