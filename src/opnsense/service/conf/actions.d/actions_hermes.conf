# Hermes AI plugin configd actions

[hermes]
    desc = Hermes AI assistant
    run = plugins.pyHermes plugin

[hermes enable]
    desc = Enable Hermes AI
    plugin = Hermes

[hermes disable]
    desc = Disable Hermes AI
    plugin = Hermes

# --- Security Wizard actions (tiers 1-3) ---
# Each action maps to a script in /usr/local/opnsense/scripts/hermes/
# All are read/validate-then-apply and log to /var/log/hermes-security.log

[hermes unbound.enable]
    desc = Enable Unbound DNS with local cache
    run = /usr/local/opnsense/scripts/hermes/security.py enable_unbound
    type = script

[hermes unbound.blocklist]
    desc = Install ad/tracker DNS blocklists
    run = /usr/local/opnsense/scripts/hermes/security.py blocklist
    type = script

[hermes unbound.doh]
    desc = Configure DNS-over-HTTPS upstream
    run = /usr/local/opnsense/scripts/hermes/security.py doh
    type = script

[hermes unbound.dnssec]
    desc = Enable DNSSEC validation
    run = /usr/local/opnsense/scripts/hermes/security.py dnssec
    type = script

[hermes unbound.dot]
    desc = Configure DNS-over-TLS upstreams
    run = /usr/local/opnsense/scripts/hermes/security.py dot
    type = script

[hermes firewall.rule]
    desc = Add required firewall rules
    run = /usr/local/opnsense/scripts/hermes/security.py firewall
    type = script

[hermes tailscale.exitnode]
    desc = Enable Tailscale exit node
    run = /usr/local/opnsense/scripts/hermes/security.py tailscale
    type = script
