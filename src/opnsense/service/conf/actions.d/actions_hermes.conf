# Hermes AI plugin configd actions (OPNsense 26.7 colon syntax)

[hermes]
    command:/usr/local/opnsense/scripts/hermes/hermes.php
    type:script
    message:Hermes AI assistant
    description:Hermes AI assistant

[enable]
    command:/usr/local/opnsense/scripts/hermes/enable.php
    type:script
    message:Enable Hermes AI
    description:Enable Hermes AI

[disable]
    command:/usr/local/opnsense/scripts/hermes/disable.php
    type:script
    message:Disable Hermes AI
    description:Disable Hermes AI

# Security Wizard actions — call security.py with the action name
[unbound-enable]
    command:/usr/local/opnsense/scripts/hermes/security.py enable_unbound
    type:script
    message:Enable Unbound DNS with local cache
    description:Enable Unbound DNS with local cache

[blocklist]
    command:/usr/local/opnsense/scripts/hermes/security.py blocklist
    type:script
    message:Install ad/tracker DNS blocklists
    description:Install ad/tracker DNS blocklists

[doh]
    command:/usr/local/opnsense/scripts/hermes/security.py doh
    type:script
    message:Configure encrypted DNS upstream
    description:Configure encrypted DNS upstream

[dnssec]
    command:/usr/local/opnsense/scripts/hermes/security.py dnssec
    type:script
    message:Enable DNSSEC validation
    description:Enable DNSSEC validation

[dot]
    command:/usr/local/opnsense/scripts/hermes/security.py dot
    type:script
    message:Configure DNS-over-TLS upstreams
    description:Configure DNS-over-TLS upstreams

[firewall]
    command:/usr/local/opnsense/scripts/hermes/security.py firewall
    type:script
    message:Add required firewall rules
    description:Add required firewall rules

[tailscale]
    command:/usr/local/opnsense/scripts/hermes/security.py tailscale
    type:script
    message:Enable Tailscale exit node
    description:Enable Tailscale exit node

[record_level]
    command:/usr/local/opnsense/scripts/hermes/security.py record_level
    type:script
    message:Record applied security level
    description:Record applied security level

[clamav]
    command:/usr/local/opnsense/scripts/hermes/security.py clamav
    type:script
    message:Enable ClamAV antivirus
    description:Enable ClamAV antivirus

[crowdsec]
    command:/usr/local/opnsense/scripts/hermes/security.py crowdsec
    type:script
    message:Enable CrowdSec intrusion prevention
    description:Enable CrowdSec intrusion prevention
